<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Why the AgentSession seam sits above the loop, not at the model API</title>

  <!-- No background rect, and every colour holds contrast on both a near-white and
       a near-black page. Same palette as the other diagrams in docs/. -->

  <defs>
    <marker id="s-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="s-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8899ad"/>
    </marker>
  </defs>

  <!-- ============ the seam itself ============ -->
  <line x1="40" y1="150" x2="960" y2="150" stroke="#8b5cf6" stroke-width="2.5"/>
  <rect x="392" y="126" width="216" height="48" rx="8" fill="#7c3aed26" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500" y="149" text-anchor="middle" font-size="14" fill="#c9d3e0"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">agent.AgentSession</text>
  <text x="500" y="164" text-anchor="middle" font-size="10" fill="#8899ad">SendTurn · Events · Cancel · Close</text>

  <!-- Everything above the seam is shared. -->
  <text x="52" y="146" font-size="11" font-weight="600" fill="#8899ad">above: one code path</text>
  <text x="52" y="172" font-size="11" font-weight="600" fill="#8899ad">below: two loops</text>

  <!-- ============ shared side ============ -->
  <g stroke-width="1.5">
    <rect x="330" y="40" width="340" height="52" rx="6" fill="#6366f120" stroke="#7c8cf8"/>
  </g>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#c9d3e0"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ws/handler + ws/executor</text>
  <text x="500" y="79" text-anchor="middle" font-size="10.5" fill="#8899ad">knows no model, no MCP, no subprocess</text>

  <g stroke="#8b5cf6" stroke-width="1.75" fill="none" marker-end="url(#s-violet)">
    <path d="M500,92 L500,122"/>
  </g>

  <!-- ============ left: Claude Code owns its loop ============ -->
  <g stroke="#94a3b8" stroke-dasharray="5 4" fill="#94a3b810">
    <rect x="40" y="200" width="420" height="240" rx="8"/>
  </g>
  <text x="250" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#8899ad">
    Claude Code — the loop is inside the subprocess
  </text>

  <g stroke-width="1.5">
    <rect x="70" y="240" width="170" height="46" rx="6" fill="#6366f120" stroke="#7c8cf8"/>
    <rect x="262" y="240" width="170" height="46" rx="6" fill="#6366f120" stroke="#7c8cf8"/>
    <rect x="166" y="352" width="170" height="46" rx="6" fill="#7c3aed20" stroke="#8b5cf6"/>
  </g>
  <g font-size="12.5" fill="#c9d3e0" text-anchor="middle"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="155" y="268">claudecode</text>
    <text x="347" y="268">claude -p</text>
    <text x="251" y="380">claudecode/mcp</text>
  </g>

  <g stroke="#8899ad" stroke-width="1.6" fill="none" marker-end="url(#s-grey)">
    <path d="M240,258 L256,258"/>
  </g>
  <g stroke="#8b5cf6" stroke-width="1.75" fill="none" marker-end="url(#s-violet)">
    <path d="M347,286 L347,330 L300,330 L300,352"/>
    <path d="M200,352 L200,300 L200,292"/>
  </g>
  <g font-size="10.5" fill="#8899ad">
    <text x="360" y="316">the model decides</text>
    <text x="360" y="329">to call a tool…</text>
  </g>
  <g font-size="10.5" fill="#8b5cf6">
    <text x="60" y="322">…and it arrives</text>
    <text x="60" y="335">back over MCP</text>
  </g>
  <text x="251" y="416" text-anchor="middle" font-size="10.5" fill="#8899ad">
    tool calls are PUSHED IN to this process
  </text>
  <text x="251" y="430" text-anchor="middle" font-size="10.5" fill="#8899ad">
    bounded by --max-turns
  </text>

  <!-- ============ right: we own the loop ============ -->
  <g stroke="#94a3b8" stroke-dasharray="5 4" fill="#94a3b810">
    <rect x="540" y="200" width="420" height="240" rx="8"/>
  </g>
  <text x="750" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#8899ad">
    native — the loop is ours, in Go
  </text>

  <g stroke-width="1.5">
    <rect x="570" y="240" width="170" height="46" rx="6" fill="#6366f120" stroke="#7c8cf8"/>
    <rect x="762" y="240" width="170" height="46" rx="6" fill="#6366f120" stroke="#7c8cf8"/>
    <rect x="666" y="352" width="170" height="46" rx="6" fill="#7c3aed20" stroke="#8b5cf6"/>
  </g>
  <g font-size="12.5" fill="#c9d3e0" text-anchor="middle"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="655" y="268">native/turn.go</text>
    <text x="847" y="268">mlx_lm.server</text>
    <text x="751" y="380">native/client.go</text>
  </g>

  <g stroke="#8899ad" stroke-width="1.6" fill="none" marker-end="url(#s-grey)">
    <path d="M740,258 L756,258"/>
  </g>
  <g stroke="#8b5cf6" stroke-width="1.75" fill="none" marker-end="url(#s-violet)">
    <path d="M847,286 L847,330 L800,330 L800,352"/>
    <path d="M700,352 L700,300 L700,292"/>
  </g>
  <g font-size="10.5" fill="#8899ad">
    <text x="860" y="316">the reply is a</text>
    <text x="860" y="329">stream of text…</text>
  </g>
  <g font-size="10.5" fill="#8b5cf6">
    <text x="560" y="322">…and we parse</text>
    <text x="560" y="335">calls out of it</text>
  </g>
  <text x="751" y="416" text-anchor="middle" font-size="10.5" fill="#8899ad">
    tool calls are PULLED OUT of the stream
  </text>
  <text x="751" y="430" text-anchor="middle" font-size="10.5" fill="#8899ad">
    bounded by agent.MaxToolCallsPerTurn
  </text>

  <!-- ============ the point ============ -->
  <text x="500" y="192" text-anchor="middle" font-size="11" fill="#8b5cf6">
    an interface at the model-API level could only describe one of these two
  </text>
</svg>
